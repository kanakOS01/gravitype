[project]
name = "gravitype"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.2.7",
]

[project.scripts]
gravitype = "gravitype.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gravitype"]

[tool.hatch.build.targets.sdist]
include = [
    "gravitype/",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.15.17",
    "textual-dev>=1.8.0",
]
